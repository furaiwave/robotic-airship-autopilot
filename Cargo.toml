[workspace]
resolver = "3"
members = [
    "crates/airship-model",
    "crates/flight-dynamics",
    "crates/control-algorithms",
    "crates/autopilot",
    "crates/simulation-engine",
    "crates/api-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
authors = ["furaiwave"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
criterion = { version = "0.5", default-features = false }

airship-model = { path = "crates/airship-model" }
flight-dynamics = { path = "crates/flight-dynamics" }
control-algorithms = { path = "crates/control-algorithms" }
autopilot = { path = "crates/autopilot" }
simulation-engine = { path = "crates/simulation-engine" }

[profile.release]
debug = false
lto = "thin"

[workspace.lints.clippy]
# `!(dt > 0.0)` is used deliberately: unlike `dt <= 0.0` it also rejects NaN.
neg_cmp_op_on_partial_ord = "allow"
# Tests build configurations by modifying a default instance field by field.
field_reassign_with_default = "allow"
